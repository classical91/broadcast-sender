<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Broadcast</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#2aabee">
<meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0f12;--surface:#151820;--border:#1e2330;--accent:#2aabee;--text:#e8eaf0;--muted:#4a5168;--sent:#1a2a3a;--green:#43b77a;--red:#e05a5a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',sans-serif;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
.shell{width:100%;max-width:560px;height:100vh;max-height:900px;display:flex;flex-direction:column;border:1px solid var(--border);border-radius:16px;overflow:hidden;background:var(--surface);box-shadow:0 32px 80px rgba(0,0,0,.6)}
.header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;background:var(--bg);flex-shrink:0}
.header-icon{width:34px;height:34px;background:var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.header-text h1{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;letter-spacing:.04em}
.header-text p{font-size:11px;color:var(--muted);margin-top:1px}
.dot-wrap{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);font-family:'IBM Plex Mono',monospace}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.token-bar{padding:8px 14px;border-bottom:1px solid var(--border);background:var(--bg);flex-shrink:0}
.token-bar input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:11px;padding:7px 10px;outline:none;transition:border-color .2s}
.token-bar input:focus{border-color:var(--accent)}
.token-bar input::placeholder{color:var(--muted)}
.groups-panel{overflow-y:auto;flex-shrink:0;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.group-block{border-bottom:1px solid var(--border)}
.group-block:last-child{border-bottom:none}
.group-head{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--bg)}
.group-name{flex:1;background:transparent;border:none;border-bottom:1px solid transparent;color:var(--accent);font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;outline:none;padding:2px 4px;min-width:0}
.group-name:focus{border-bottom-color:var(--accent)}
.toggle{position:relative;display:inline-block;width:30px;height:16px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:var(--border);border-radius:16px;cursor:pointer;transition:.2s}
.slider:before{content:'';position:absolute;width:10px;height:10px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.toggle input:checked+.slider{background:var(--accent)}
.toggle input:checked+.slider:before{transform:translateX(14px)}
.del-group{background:none;border:none;color:var(--muted);font-size:14px;cursor:pointer;padding:2px 4px;line-height:1}
.del-group:hover{color:var(--red)}
.chat-rows{padding:4px 14px 6px 14px;display:flex;flex-direction:column;gap:4px}
.chat-row{display:flex;gap:6px;align-items:center}
.chat-row input{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:7px;color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:11px;padding:5px 8px;outline:none;transition:border-color .2s;min-width:0}
.chat-row input:focus{border-color:var(--accent)}
.chat-row input::placeholder{color:var(--muted)}
.thread-input{max-width:72px!important}
.del-row{background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;padding:2px;flex-shrink:0}
.del-row:hover{color:var(--red)}
.add-chat-btn{margin:0 14px 8px;background:none;border:1px dashed var(--border);border-radius:7px;color:var(--muted);font-size:11px;font-family:'IBM Plex Mono',monospace;padding:5px 10px;cursor:pointer;width:calc(100% - 28px);transition:border-color .2s,color .2s}
.add-chat-btn:hover{border-color:var(--accent);color:var(--accent)}
.add-group-btn{margin:8px 14px;background:none;border:1px dashed var(--border);border-radius:8px;color:var(--muted);font-size:11px;font-family:'IBM Plex Mono',monospace;padding:6px 10px;cursor:pointer;width:calc(100% - 28px);transition:border-color .2s,color .2s}
.add-group-btn:hover{border-color:var(--accent);color:var(--accent)}
.messages{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.empty-state{margin:auto;text-align:center;color:var(--muted)}
.empty-state .icon{font-size:30px;margin-bottom:8px}
.empty-state p{font-size:12px;font-family:'IBM Plex Mono',monospace}
.msg{display:flex;flex-direction:column;align-items:flex-end;gap:4px;animation:fadeUp .25s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg-bubble{background:var(--sent);border:1px solid var(--border);border-radius:12px 12px 4px 12px;padding:10px 14px;max-width:85%;font-size:13px;line-height:1.5;word-break:break-word}
.msg-bubble img{max-width:100%;border-radius:8px;margin-bottom:6px;display:block}
.msg-meta{display:flex;align-items:center;gap:6px;font-size:10px;font-family:'IBM Plex Mono',monospace;color:var(--muted)}
.tag{padding:2px 6px;border-radius:4px;font-size:10px}
.tag-ok{background:rgba(67,183,122,.15);color:var(--green)}
.tag-err{background:rgba(224,90,90,.15);color:var(--red)}
.tag-pending{background:rgba(42,171,238,.15);color:var(--accent)}
.composer{padding:10px 14px;border-top:1px solid var(--border);background:var(--bg);display:flex;flex-direction:column;gap:8px;flex-shrink:0}
.composer-row{display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:12px;color:var(--text);font-family:'IBM Plex Sans',sans-serif;font-size:14px;padding:10px 14px;resize:none;outline:none;min-height:44px;max-height:120px;line-height:1.5;transition:border-color .2s;overflow-y:auto}
textarea::placeholder{color:var(--muted)}
textarea:focus{border-color:var(--accent)}
.icon-btn{width:40px;height:40px;background:var(--surface);border:1px solid var(--border);border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px;color:var(--muted);transition:border-color .2s,color .2s}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.send-btn{width:40px;height:40px;background:var(--accent);border:none;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .2s,transform .1s}
.send-btn:hover{background:#1a9dd8}
.send-btn:active{transform:scale(.94)}
.send-btn:disabled{background:var(--muted);cursor:not-allowed}
.send-btn svg{width:18px;height:18px;fill:white}
.preview-wrap{position:relative;display:inline-block}
.preview-wrap img{height:56px;border-radius:8px;border:1px solid var(--border)}
.preview-wrap .remove{position:absolute;top:-6px;right:-6px;width:16px;height:16px;background:var(--red);border-radius:50%;border:none;color:#fff;font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#fileInput{display:none}
.channels-bar{padding:9px 14px;border-bottom:1px solid var(--border);background:var(--bg);display:flex;align-items:center;gap:8px;cursor:pointer;flex-shrink:0;user-select:none;-webkit-user-select:none;transition:background .15s}
.channels-bar:active{background:#0f1116}
.channels-bar-label{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;color:var(--text);flex:1}
.channels-chevron{font-size:10px;color:var(--muted);transition:transform .22s;line-height:1}
.channels-chevron.open{transform:rotate(180deg)}
.channels-badge{background:rgba(42,171,238,.12);color:var(--accent);font-size:10px;font-family:'IBM Plex Mono',monospace;padding:2px 7px;border-radius:10px;line-height:1.4}
.groups-panel-wrap{flex-shrink:0;border-bottom:1px solid var(--border)}
.grp-body{overflow:hidden;max-height:0;transition:max-height .22s ease}
.grp-body.open{max-height:600px}
.group-head{cursor:pointer}
.group-head:active{background:#0f1116}
.grp-chevron{font-size:9px;color:var(--muted);transition:transform .22s;margin-left:auto;flex-shrink:0;padding:2px 4px}
.grp-chevron.open{transform:rotate(180deg)}
.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:7px 14px;border-radius:8px;font-size:12px;font-family:'IBM Plex Mono',monospace;opacity:0;transition:opacity .3s;pointer-events:none;z-index:99}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="shell">
 <div class="header">
  <div class="header-icon">&#128225;</div>
  <div class="header-text"><h1>BROADCAST</h1><p>Direct to Telegram</p></div>
  <div class="dot-wrap"><span class="dot"></span><span>live</span></div>
 </div>
 <div class="token-bar">
  <input type="text" id="botToken" placeholder="Bot Token: 1234567890:AAF..." />
 </div>
 <div class="channels-bar" id="channelsBar" onclick="toggleChannelsPanel(event)">
  <span class="channels-bar-label">&#128225; Channels</span>
  <span class="channels-badge" id="channelsCount">0</span>
  <span class="channels-chevron" id="channelsChevron">&#9660;</span>
 </div>
 <div class="groups-panel-wrap" id="groupsPanelWrap" style="display:none">
  <div class="groups-panel" id="groupsPanel"></div>
  <button class="add-group-btn" onclick="addGroup()">+ Add Group</button>
 </div>
 <div class="messages" id="messages">
  <div class="empty-state" id="emptyState"><div class="icon">&#128752;</div><p>messages broadcast here</p></div>
 </div>
 <div class="composer">
  <div id="photoPreviewRow" style="display:none">
   <div class="preview-wrap">
    <img id="photoPreview" src="" alt="" />
    <button class="remove" onclick="clearPhoto()">x</button>
   </div>
  </div>
  <div class="composer-row">
   <textarea id="msgInput" placeholder="Type, paste, or share..." rows="1" autofocus></textarea>
   <button class="icon-btn" onclick="pasteClip()" title="Paste">&#128203;</button>
   <button class="icon-btn" onclick="document.getElementById('fileInput').click()" title="Photo">&#128247;</button>
   <button class="send-btn" id="sendBtn" onclick="sendMessage()">
    <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
   </button>
  </div>
  <input type="file" id="fileInput" accept="image/*" onchange="onFile(this)" />
 </div>
</div>
<div class="toast" id="toast"></div>
<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});

const $ = id => document.getElementById(id);
const input = $('msgInput'), messages = $('messages'), sendBtn = $('sendBtn');
let selectedFile = null, emptyRemoved = false;

// ---- Data model ----
// groups = [{id, name, enabled, chats:[{chatId,threadId}]}]
let groups = [];

function loadGroups() {
  try { groups = JSON.parse(localStorage.getItem('bc_groups') || '[]'); } catch { groups = []; }
  if (!groups.length) {
    groups = [
      { id: uid(), name: 'Group 1', enabled: true,  chats: [{ chatId: '', threadId: '' }] },
      { id: uid(), name: 'Group 2', enabled: true,  chats: [{ chatId: '', threadId: '' }] },
      { id: uid(), name: 'Group 3', enabled: false, chats: [{ chatId: '', threadId: '' }] },
    ];
  }
}

function saveGroups() { localStorage.setItem('bc_groups', JSON.stringify(groups)); }
function uid() { return Math.random().toString(36).slice(2,8); }

function renderGroups() {
  const panel = $('groupsPanel');
  panel.innerHTML = '';
  groups.forEach(g => {
    const block = document.createElement('div');
    block.className = 'group-block';
    block.id = 'grp-' + g.id;
    const isOpen = g.expanded === true;

    const chatRowsHtml = g.chats.map((c, ci) => `
      <div class="chat-row" id="crow-${g.id}-${ci}">
        <input type="text" placeholder="Chat ID (-100...)" value="${esc(c.chatId)}"
          onchange="updateChat('${g.id}',${ci},'chatId',this.value)" />
        <input type="text" class="thread-input" placeholder="Thread" value="${esc(c.threadId)}"
          onchange="updateChat('${g.id}',${ci},'threadId',this.value)" />
        <button class="del-row" onclick="removeChat('${g.id}',${ci})" title="Remove">&#10005;</button>
      </div>`).join('');

    block.innerHTML = `
      <div class="group-head" onclick="toggleGroupBody('${g.id}',event)">
        <label class="toggle" onclick="event.stopPropagation()"><input type="checkbox" ${g.enabled?'checked':''} onchange="toggleGroup('${g.id}',this.checked)" /><span class="slider"></span></label>
        <input class="group-name" type="text" value="${esc(g.name)}" onchange="renameGroup('${g.id}',this.value)" placeholder="Group name" onclick="event.stopPropagation()" />
        <button class="del-group" onclick="event.stopPropagation();removeGroup('${g.id}')" title="Delete group">&#128465;</button>
        <span class="grp-chevron ${isOpen?'open':''}">&#9660;</span>
      </div>
      <div class="grp-body ${isOpen?'open':''}" id="body-${g.id}">
        <div class="chat-rows" id="chats-${g.id}">${chatRowsHtml}</div>
        <button class="add-chat-btn" onclick="addChat('${g.id}')">+ Add Chat ID</button>
      </div>`;
    panel.appendChild(block);
  });
  updateChannelsBadge();
}

function updateChannelsBadge() {
  const enabled = groups.filter(g => g.enabled && g.chats.some(c => c.chatId)).length;
  const el = $('channelsCount');
  if (el) el.textContent = enabled + '/' + groups.length;
}

function toggleGroupBody(gid, e) {
  const g = groups.find(x => x.id === gid); if (!g) return;
  g.expanded = !g.expanded;
  const body = $('body-' + gid);
  const chev = document.querySelector('#grp-' + gid + ' .grp-chevron');
  if (body) body.classList.toggle('open', g.expanded);
  if (chev) chev.classList.toggle('open', g.expanded);
  saveGroups();
}

function toggleChannelsPanel(e) {
  if (e) e.stopPropagation();
  const wrap = $('groupsPanelWrap');
  const chev = $('channelsChevron');
  const isOpen = wrap.style.display !== 'none';
  wrap.style.display = isOpen ? 'none' : 'block';
  if (chev) chev.classList.toggle('open', !isOpen);
}

function updateChat(gid, ci, field, val) {
  const g = groups.find(x => x.id === gid); if (!g) return;
  g.chats[ci][field] = val.trim(); saveGroups(); if(field==='chatId') updateChannelsBadge();
}
function toggleGroup(gid, val) {
  const g = groups.find(x => x.id === gid); if (!g) return;
  g.enabled = val; saveGroups(); updateChannelsBadge();
}
function renameGroup(gid, val) {
  const g = groups.find(x => x.id === gid); if (!g) return;
  g.name = val; saveGroups();
}
function addChat(gid) {
  const g = groups.find(x => x.id === gid); if (!g) return;
  g.chats.push({ chatId: '', threadId: '' }); saveGroups(); renderGroups();
}
function removeChat(gid, ci) {
  const g = groups.find(x => x.id === gid); if (!g) return;
  if (g.chats.length <= 1) { g.chats[0] = { chatId: '', threadId: '' }; }
  else g.chats.splice(ci, 1);
  saveGroups(); renderGroups();
}
function removeGroup(gid) {
  if (groups.length <= 1) return toast('Need at least one group');
  groups = groups.filter(x => x.id !== gid); saveGroups(); renderGroups();
}
function addGroup() {
  groups.push({ id: uid(), name: 'Group ' + (groups.length + 1), enabled: true, chats: [{ chatId: '', threadId: '' }] });
  saveGroups(); renderGroups();
  setTimeout(() => $('groupsPanel').scrollTop = $('groupsPanel').scrollHeight, 50);
}

function getTargets() {
  const targets = [];
  groups.filter(g => g.enabled).forEach(g => {
    g.chats.filter(c => c.chatId).forEach(c => {
      targets.push({ chatId: c.chatId, threadId: c.threadId || null });
    });
  });
  return targets;
}

// ---- Token ----
$('botToken').value = localStorage.getItem('bc_token') || '';
$('botToken').addEventListener('input', () => localStorage.setItem('bc_token', $('botToken').value.trim()));

// ---- Init ----
loadGroups(); renderGroups();
window.addEventListener('load', () => setTimeout(() => input.focus(), 300));

input.addEventListener('input', () => { input.style.height='auto'; input.style.height=Math.min(input.scrollHeight,120)+'px'; });
input.addEventListener('keydown', e => { if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();} });

// ---- Clipboard paste ----
async function pasteClip() {
  try {
    const items = await navigator.clipboard.read();
    for (const item of items) {
      for (const type of item.types) {
        if (type.startsWith('image/')) {
          const blob = await item.getType(type);
          selectedFile = new File([blob],'clipboard.png',{type});
          $('photoPreview').src = URL.createObjectURL(blob);
          $('photoPreviewRow').style.display = 'block';
          toast('Image pasted'); return;
        }
      }
      if (item.types.includes('text/plain')) {
        const blob = await item.getType('text/plain');
        input.value = await blob.text();
        input.style.height='auto'; input.style.height=Math.min(input.scrollHeight,120)+'px';
        input.focus(); toast('Pasted'); return;
      }
    }
  } catch { input.focus(); toast('Press Ctrl+V to paste'); }
}

// ---- Share target ----
const params = new URLSearchParams(location.search);
if (params.get('shared') === 'text') {
  input.value = decodeURIComponent(params.get('text') || '');
  history.replaceState({},'','/');
  setTimeout(() => input.focus(), 300);
} else if (params.get('shared') === 'photo') {
  const key = params.get('key') || '', caption = decodeURIComponent(params.get('caption') || '');
  history.replaceState({},'','/');
  if (key) fetch('/shared-file/'+key).then(r=>r.ok?r.json():Promise.reject()).then(file=>{
    const bytes=Uint8Array.from(atob(file.data),c=>c.charCodeAt(0));
    const blob=new Blob([bytes],{type:file.mimetype});
    selectedFile=new File([blob],file.filename,{type:file.mimetype});
    $('photoPreview').src=URL.createObjectURL(blob);
    $('photoPreviewRow').style.display='block';
    if(caption) input.value=caption;
    const token=$('botToken').value.trim();
    if(token&&getTargets().length) setTimeout(sendMessage,600);
  }).catch(()=>toast('Could not load shared image'));
}

// ---- File picker ----
function onFile(el) {
  const file=el.files[0]; if(!file) return;
  selectedFile=file;
  $('photoPreview').src=URL.createObjectURL(file);
  $('photoPreviewRow').style.display='block';
  el.value='';
}
function clearPhoto() {
  selectedFile=null;
  $('photoPreviewRow').style.display='none';
  $('photoPreview').src='';
}

// ---- Send ----
async function sendMessage() {
  const text=input.value.trim(), token=$('botToken').value.trim();
  const targets=getTargets(), photo=selectedFile;
  if(!text&&!photo) return;
  if(!token){alert('Enter your bot token.');return;}
  if(!targets.length){alert('Enable a group and add at least one Chat ID.');return;}

  const snap=text; input.value=''; input.style.height='auto'; clearPhoto(); sendBtn.disabled=true;
  if(!emptyRemoved){const e=$('emptyState');if(e)e.remove();emptyRemoved=true;}
  const msgEl=bbl(snap,photo,'pending','sending...');

  try {
    let data;
    if (photo) {
      const form=new FormData();
      form.append('token',token);
      form.append('targets',JSON.stringify(targets));
      form.append('caption',snap);
      form.append('photo',photo,photo.name);
      const res=await fetch('/send-photo',{method:'POST',body:form});
      if(!res.ok) throw new Error('HTTP '+res.status);
      data=await res.json();
    } else {
      const res=await fetch('/send',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({token,targets,message:snap})});
      if(!res.ok) throw new Error('HTTP '+res.status);
      data=await res.json();
    }
    tag(msgEl,data.sent>0?'ok':'err',data.sent>0?'sent '+data.sent+'/'+data.total:(data.errors||['failed'])[0]);
  } catch(e){tag(msgEl,'err',e.message.slice(0,60));}

  sendBtn.disabled=false; setTimeout(()=>input.focus(),100);
}

function bbl(text,photo,cls,txt){
  const wrap=document.createElement('div'); wrap.className='msg';
  const now=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  let inner='';
  if(photo) inner+='<img src="'+URL.createObjectURL(photo)+'" />';
  if(text) inner+=esc(text);
  wrap.innerHTML='<div class="msg-bubble">'+inner+'</div><div class="msg-meta"><span>'+now+'</span><span class="tag tag-'+cls+'" data-tag>'+txt+'</span></div>';
  messages.appendChild(wrap); messages.scrollTop=messages.scrollHeight; return wrap;
}
function tag(el,cls,txt){const t=el.querySelector('[data-tag]');if(!t)return;t.className='tag tag-'+cls;t.textContent=txt;}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}
</script>
</body>
</html>
